; PlatformIO Project Configuration File
;
; M5Stack Paper Color: ESP32-S3, 16MB flash, 8MB octal PSRAM.
; There is no dedicated PlatformIO board for it, so we use the generic
; S3 N16R8 definition, which matches the hardware (qio flash + opi PSRAM).
; M5GFX requires OPI PSRAM to drive the colour e-paper panel.
; M5Unified autodetects the board at runtime.
; (Same setup as ../readerpedia, which established all of this.)

[env:m5paper_color]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
extra_scripts = pre:tools/gen_secrets.py
monitor_speed = 115200
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
board_build.partitions = default_16MB.csv
lib_deps =
    m5stack/M5Unified@^0.2.4
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
